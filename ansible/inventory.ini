# Fill in from `terraform output`. The Jenkins pipeline overwrites this file automatically.
#   ansible_host = address Ansible connects to (public IP from your PC, private IP from the Jenkins server)
#   public_ip    = the server's public IP (added to the Kubernetes API certificate)

[jenkins]
jenkins-host ansible_host=JENKINS_IP public_ip=JENKINS_PUBLIC_IP

[k8s_master]
k8s-node-1 ansible_host=K8S_NODE_1_IP public_ip=K8S_NODE_1_PUBLIC_IP

[k8s_workers]
k8s-node-2 ansible_host=K8S_NODE_2_IP public_ip=K8S_NODE_2_PUBLIC_IP

[k8s_cluster:children]
k8s_master
k8s_workers

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
# Pass the key on the command line instead:  --private-key ~/.ssh/oeson_key
