---
# Builds a 2-node Kubernetes cluster with kubeadm: k8s-node-1 = control plane, k8s-node-2 = worker.
# NOTE: t2.micro (1 CPU, 1 GB) is below kubeadm's minimum (2 CPU, 1.7 GB), so the size checks are
# ignored. It can work for a small demo but may be slow or run out of memory.

- name: Prepare every Kubernetes node
  hosts: k8s_cluster
  become: true
  vars:
    k8s_version: "v1.30"
  tasks:
    - name: Turn swap off now
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Keep swap off after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Kernel network settings for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Install containerd and apt helpers
      ansible.builtin.apt:
        name:
          - containerd
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Generate the default containerd config (once)
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml && touch /etc/containerd/.oeson-configured
      args:
        creates: /etc/containerd/.oeson-configured

    - name: Use systemd cgroups in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Add the Kubernetes repository key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Add the Kubernetes repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold the Kubernetes packages at this version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Make sure containerd and kubelet are running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - containerd
        - kubelet

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

- name: Create the control plane on k8s-node-1
  hosts: k8s_master
  become: true
  tasks:
    - name: Run kubeadm init (skipped if the cluster already exists)
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --pod-network-cidr=10.244.0.0/16
          - "--apiserver-advertise-address={{ ansible_default_ipv4.address }}"
          - "--apiserver-cert-extra-sans={{ public_ip }}"
          - --ignore-preflight-errors=NumCPU,Mem
        creates: /etc/kubernetes/admin.conf

    - name: Create the kubeconfig folder for the ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin.conf for the ubuntu user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Install the Flannel pod network
      ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel
      retries: 10
      delay: 15
      until: flannel.rc == 0
      changed_when: "'created' in flannel.stdout"

    - name: Create a worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

- name: Join the worker to the cluster
  hosts: k8s_workers
  become: true
  tasks:
    - name: Run kubeadm join (skipped if already joined)
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['k8s_master'][0]].join_command.stdout }}"
        creates: /etc/kubernetes/kubelet.conf

- name: Wait until both nodes are Ready
  hosts: k8s_master
  become: true
  tasks:
    - name: Check the nodes
      ansible.builtin.command:
        cmd: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes
      retries: 20
      delay: 15
      until: nodes.stdout_lines | length == 2 and (nodes.stdout_lines | select('search', ' Ready ') | list | length == 2)
      changed_when: false

    - name: Show the nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
